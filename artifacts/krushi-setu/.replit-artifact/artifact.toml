kind = "web"
previewPath = "/"
title = "Krushi Setu"
description = "A functional agritech prototype that connects Maharashtra farmers with prototype market prices, verified buyers, collective selling opportunities, transparent transactions, and government impact analytics."
version = "1.0.0"
id = "artifacts/krushi-setu"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20154

[services.development]
run = "pnpm --filter @workspace/krushi-setu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/krushi-setu", "run", "build" ]
serve = "static"
publicDir = "artifacts/krushi-setu/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20154"
BASE_PATH = "/"
